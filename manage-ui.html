<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZionyasVan 管理工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
.header{background:#1a1a2e;padding:16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2a4a}
.header h1{font-size:20px;color:#a78bfa}
.tabs{display:flex;gap:4px;padding:12px 24px;background:#12122a;border-bottom:1px solid #2a2a4a}
.tab{padding:10px 20px;border:none;background:transparent;color:#888;cursor:pointer;border-radius:8px;font-size:14px;transition:.2s}
.tab:hover{color:#ccc;background:#1a1a3a}
.tab.active{background:#a78bfa;color:#fff}
.panels{padding:24px;max-width:900px}
.panel{display:none}
.panel.active{display:block}
.card{background:#1a1a2e;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2a2a4a}
.card h3{font-size:16px;margin-bottom:16px;color:#c4b5fd}
label{display:block;font-size:13px;color:#999;margin-bottom:4px;margin-top:12px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #3a3a5a;border-radius:8px;background:#0f0f1a;color:#e0e0e0;font-size:14px;font-family:inherit;resize:vertical}
textarea{min-height:120px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#a78bfa}
.row{display:flex;gap:12px}
.row>*{flex:1}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-primary{background:#a78bfa;color:#fff}
.btn-primary:hover{background:#8b6fe0}
.btn-success{background:#22c55e;color:#fff}
.btn-success:hover{background:#16a34a}
.btn-danger{background:#ef4444;color:#fff;padding:6px 12px;font-size:12px}
.btns{margin-top:20px;display:flex;gap:8px}
.result{padding:12px;border-radius:8px;margin-top:12px;font-size:13px;display:none}
.result.success{display:block;background:#22c55e20;color:#4ade80;border:1px solid #22c55e40}
.result.error{display:block;background:#ef444420;color:#f87171;border:1px solid #ef444440}
.result pre{white-space:pre-wrap;margin:0;font-family:inherit}
.tag-row{display:flex;gap:8px;align-items:center}
.tag-row input{flex:1}
.tag-row button{padding:8px 12px}
.dl-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.dl-row input{flex:1}
.dl-row select{width:120px;flex:none}
.hint{font-size:12px;color:#666;margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <span style="font-size:24px">🛠️</span>
  <h1>ZionyasVan 内容管理工具</h1>
</div>

<div class="tabs">
  <button class="tab active" data-panel="blog">发布博客</button>
  <button class="tab" data-panel="project">发布作品</button>
  <button class="tab" data-panel="video">发布视频</button>
  <button class="tab" data-panel="push">实时推送</button>
  <button class="tab" data-panel="manage-posts">管理博客</button>
  <button class="tab" data-panel="manage-projects">管理作品</button>
  <button class="tab" data-panel="manage-videos">管理视频</button>

</div>

<div class="panels">

<!-- ========== 博客面板 ========== -->
<div class="panel active" id="panel-blog">
  <div class="card">
    <h3>发布新博客文章</h3>
    <label>文章标题 *</label>
    <input id="blog-title" placeholder="输入文章标题">

    <label>简短描述</label>
    <input id="blog-desc" placeholder="一句话描述（可选）">

    <label>标签（用逗号分隔）</label>
    <input id="blog-tags" placeholder="例如: Minecraft, 教程, 生存">

    <div class="row">
      <div>
        <label>分类文件夹 *</label>
        <select id="blog-category">
          <option value="">加载中...</option>
        </select>
      </div>
      <div>
        <label>URL 标识 (slug) *</label>
        <input id="blog-slug" placeholder="my-first-post">
        <div class="hint">英文+连字符，如 my-first-post</div>
      </div>
    </div>

    <label>文章内容 (Markdown) *</label>
    <textarea id="blog-content" placeholder="在这里写 Markdown 内容..."></textarea>

    <div class="btns">
      <button class="btn btn-primary" onclick="createPost()">✅ 生成文章文件</button>
    </div>
    <div class="result" id="blog-result"></div>
  </div>
</div>

<!-- ========== 作品面板 ========== -->
<div class="panel" id="panel-project">
  <div class="card">
    <h3>新建作品（游戏/软件）</h3>
    <div class="row">
      <div><label>唯一 ID *</label><input id="proj-id" placeholder="my-awesome-game"></div>
      <div><label>作品名称 *</label><input id="proj-title" placeholder="作品名称"></div>
    </div>
    <label>简短描述</label>
    <input id="proj-desc" placeholder="一句话描述">
    <label>详细介绍</label>
    <textarea id="proj-long" placeholder="支持多行，详细描述作品的功能和特色" style="min-height:100px"></textarea>
    <div class="row">
      <div>
        <label>类型 *</label>
        <select id="proj-type"><option value="software">💻 软件</option><option value="game">🎮 游戏</option></select>
      </div>
      <div>
        <label>平台</label>
        <input id="proj-platform" placeholder="Windows / macOS / Web">
      </div>
      <div>
        <label>状态</label>
        <select id="proj-status"><option value="已发布">已发布</option><option value="开发中">开发中</option><option value="抢先体验">抢先体验</option><option value="已完结">已完结</option></select>
      </div>
    </div>
    <label>标签（用逗号分隔）</label>
    <input id="proj-tags" placeholder="Python, 工具, Windows">
    <label>封面图</label>
    <input type="file" id="proj-cover" accept="image/*">
    <div class="hint">不上传则使用默认占位图</div>
    <label>下载链接</label>
    <div id="dl-list">
      <div class="dl-row">
        <select class="dl-icon"><option value="">无图标</option><option value="fa6-brands:github">GitHub</option><option value="fa6-brands:steam">Steam</option><option value="fa6-brands:google-drive">网盘</option></select>
        <input class="dl-label" placeholder="按钮文字（如 GitHub / 百度网盘）">
        <input class="dl-url" placeholder="链接地址 https://...">
        <button class="btn btn-danger" onclick="this.closest('.dl-row').remove()">✕</button>
      </div>
    </div>
    <button class="btn" style="background:#2a2a4a;color:#ccc;font-size:12px;margin-top:4px" onclick="addDlRow()">+ 添加下载链接</button>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <input type="checkbox" id="proj-featured" checked style="width:auto"> 显示在首页精选区
    </label>
    <div class="btns">
      <button class="btn btn-primary" onclick="createProject()">✅ 新建作品</button>
    </div>
    <div class="result" id="project-result"></div>
  </div>
</div>

<!-- ========== 视频面板 ========== -->
<div class="panel" id="panel-video">
  <div class="card">
    <h3>🎬 新建视频</h3>
    <div class="row">
      <div><label>唯一 ID *</label><input id="vid-id" placeholder="video-01"></div>
      <div><label>视频标题 *</label><input id="vid-title" placeholder="视频标题"></div>
    </div>
    <label>B站 BV 号 *</label>
    <input id="vid-bvid" placeholder="BV1xx411c7mD">
    <label>简短描述</label>
    <input id="vid-desc" placeholder="视频简介">
    <label>封面图（选填）</label>
    <input type="file" id="vid-cover" accept="image/*">
    <div class="hint">不上传则自动使用B站封面</div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <input type="checkbox" id="vid-featured" checked style="width:auto"> 显示在首页精选区
    </label>
    <div class="btns">
      <button class="btn btn-primary" onclick="createVideo()">✅ 新建视频</button>
    </div>
    <div class="result" id="video-result"></div>
  </div>
</div>

<!-- ========== 推送面板 ========== -->
<div class="panel" id="panel-push">
  <div class="card">
    <h3>🚀 推送到 GitHub</h3>
    <p style="color:#999;font-size:13px;margin-bottom:12px">将本地所有改动提交并推送到 GitHub，自动触发网站部署。</p>
    <label>提交说明</label>
    <input id="push-msg" placeholder="通过管理工具更新内容" value="通过管理工具更新内容">
    <div class="btns">
      <button class="btn btn-success" onclick="doPush()">🚀 一键推送</button>
    </div>
    <div class="result" id="push-result"></div>
  </div>
</div>

<!-- ========== 管理博客面板 ========== -->
<div class="panel" id="panel-manage-posts">
  <div class="card"><h3>📋 管理博客文章</h3>
    <div id="posts-list"><p style="color:#888">加载中...</p></div>
    <div id="posts-editor" style="display:none">
      <input type="hidden" id="edit-post-cat">
      <input type="hidden" id="edit-post-slug">
      <label>标题</label><input id="edit-post-title">
      <label>描述</label><input id="edit-post-desc">
      <label>标签（逗号分隔）</label><input id="edit-post-tags">
      <label>内容 (Markdown)</label><textarea id="edit-post-content" style="min-height:200px"></textarea>
      <div class="btns">
        <button class="btn btn-primary" onclick="savePostEdit()">💾 保存修改</button>
        <button class="btn" style="background:#555" onclick="cancelPostEdit()">取消</button>
      </div>
      <div class="result" id="edit-post-result"></div>
    </div>
  </div>
</div>

<!-- ========== 管理作品面板 ========== -->
<div class="panel" id="panel-manage-projects">
  <div class="card"><h3>📋 管理作品</h3>
    <div id="projects-admin-list"><p style="color:#888">加载中...</p></div>
    <div id="projects-admin-editor" style="display:none">
      <input type="hidden" id="admin-proj-id">
      <div class="row"><div><label>名称</label><input id="admin-proj-title"></div><div><label>类型</label><select id="admin-proj-type"><option value="software">💻 软件</option><option value="game">🎮 游戏</option></select></div></div>
      <label>描述</label><input id="admin-proj-desc">
      <label>详细介绍</label><textarea id="admin-proj-long" style="min-height:80px"></textarea>
      <div class="row"><div><label>平台</label><input id="admin-proj-platform"></div><div><label>状态</label><select id="admin-proj-status"><option value="已发布">已发布</option><option value="开发中">开发中</option><option value="抢先体验">抢先体验</option></select></div></div>
      <label>标签（逗号分隔）</label><input id="admin-proj-tags">
      <label>封面图（留空则不改）</label><input type="file" id="admin-proj-cover" accept="image/*">
      <label>下载链接（格式：按钮文字|链接|图标名，每行一个。图标可选：github/steam/drive）</label>
      <textarea id="admin-proj-dl" style="min-height:60px" placeholder="GitHub|https://...|github&#10;百度网盘|https://...|"></textarea>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="admin-proj-featured" style="width:auto"> 首页精选</label>
      <div class="btns">
        <button class="btn btn-primary" onclick="saveProjectEdit()">💾 保存修改</button>
        <button class="btn" style="background:#555" onclick="cancelProjectEdit()">取消</button>
      </div>
      <div class="result" id="edit-project-result"></div>
    </div>
  </div>
</div>

<!-- ========== 管理视频面板 ========== -->
<div class="panel" id="panel-manage-videos">
  <div class="card"><h3>管理视频</h3>
    <div id="videos-admin-list"><p style="color:#888">加载中...</p></div>
    <div id="videos-admin-editor" style="display:none">
      <input type="hidden" id="admin-vid-id">
      <div class="row"><div><label>标题</label><input id="admin-vid-title"></div><div><label>BV号</label><input id="admin-vid-bvid"></div></div>
      <label>描述</label><input id="admin-vid-desc">
      <label>封面图（留空则不改）</label><input type="file" id="admin-vid-cover" accept="image/*">
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="admin-vid-featured" style="width:auto"> 首页精选</label>
      <div class="btns">
        <button class="btn btn-primary" onclick="saveVideoEdit()">💾 保存修改</button>
        <button class="btn" style="background:#555" onclick="cancelVideoEdit()">取消</button>
      </div>
      <div class="result" id="edit-video-result"></div>
    </div>
  </div>
</div>

</div>

<script>
// ========== 基础工具 ==========
function $(id){return document.getElementById(id)}
function showResult(id, ok, msg){
  const el = $(id);
  el.className = `result ${ok?'success':'error'}`;
  el.innerHTML = ok ? `<pre>✅ ${msg}</pre>` : `<pre>❌ ${msg}</pre>`;
}
async function api(url, data, method){
  const m = method || (data?'POST':'GET');
  const opts = {
    method: m,
    headers: data?{'Content-Type':'application/json'}:{},
    body: data?JSON.stringify(data):undefined
  };
  const res = await fetch(url, opts);
  return res.json();
}

// ========== 标签切换 ==========
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('panel-'+t.dataset.panel).classList.add('active');
  };
});

// 切换到管理页时自动加载列表
document.querySelectorAll('.tab[data-panel="manage-posts"]').forEach(t=>{
  const orig=t.onclick;t.onclick=()=>{orig&&orig.call(t);loadPostsList();};
});
document.querySelectorAll('.tab[data-panel="manage-projects"]').forEach(t=>{
  const orig=t.onclick;t.onclick=()=>{orig&&orig.call(t);loadProjectsList();};
});
document.querySelectorAll('.tab[data-panel="manage-videos"]').forEach(t=>{
  const orig=t.onclick;t.onclick=()=>{orig&&orig.call(t);loadVideosList();};
});


// ========== 博客 ==========
(async function loadCategories(){
  try{const cats=await api('/api/categories');const sel=$('blog-category');
    sel.innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('')||'<option value="">(手动输入)</option>';}
  catch(e){$('blog-category').innerHTML='<option value="">加载失败</option>';}
})();

async function createPost(){
  const title=$('blog-title').value.trim();
  const content=$('blog-content').value.trim();
  const category=$('blog-category').value.trim();
  const slug=$('blog-slug').value.trim();
  if(!title||!category||!slug||!content) return showResult('blog-result',false,'请填写所有带 * 的必填项');
  const data={
    title,
    description:$('blog-desc').value.trim(),
    tags:$('blog-tags').value.trim(),
    category, slug, content
  };
  const r=await api('/api/create-post',data);
  showResult('blog-result',r.ok, r.ok?`文章已创建: ${r.path}`:r.error);
}

// ========== 作品 ==========
function addDlRow(){
  const div=document.createElement('div');div.className='dl-row';
  div.innerHTML=`<select class="dl-icon"><option value="">无图标</option><option value="fa6-brands:github">GitHub</option><option value="fa6-brands:steam">Steam</option><option value="fa6-brands:google-drive">网盘</option></select>
    <input class="dl-label" placeholder="按钮文字"><input class="dl-url" placeholder="链接地址">
    <button class="btn btn-danger" onclick="this.closest('.dl-row').remove()">✕</button>`;
  $('dl-list').appendChild(div);
}

async function createProject(){
  const id=$('proj-id').value.trim();
  const title=$('proj-title').value.trim();
  const type=$('proj-type').value;
  if(!id||!title) return showResult('project-result',false,'请填写 ID 和名称');
  const dlRows=document.querySelectorAll('#dl-list .dl-row');
  const downloadLinks=[];
  dlRows.forEach(r=>{
    const label=r.querySelector('.dl-label').value.trim();
    const url=r.querySelector('.dl-url').value.trim();
    const icon=r.querySelector('.dl-icon').value;
    if(label&&url) downloadLinks.push({label,url,icon:icon||undefined});
  });
  let coverBase64='';
  const f=$('proj-cover').files[0];
  if(f) coverBase64=await fileToBase64(f);
  const r=await api('/api/create-project',{
    id,title,
    description:$('proj-desc').value.trim(),
    longDescription:$('proj-long').value.trim(),
    type,platform:$('proj-platform').value.trim(),
    status:$('proj-status').value,
    tags:$('proj-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    downloadLinks,featured:$('proj-featured').checked,coverBase64
  });
  showResult('project-result',r.ok, r.ok?`作品已创建: ${r.id}`:r.error);
}

// ========== 视频 ==========
async function createVideo(){
  const id=$('vid-id').value.trim();
  const title=$('vid-title').value.trim();
  const bvid=$('vid-bvid').value.trim();
  if(!id||!title||!bvid) return showResult('video-result',false,'请填写所有带 * 的必填项');
  let coverBase64='';
  const f=$('vid-cover').files[0];
  if(f) coverBase64=await fileToBase64(f);
  const r=await api('/api/create-video',{
    id,title,bvid,
    description:$('vid-desc').value.trim(),
    featured:$('vid-featured').checked,coverBase64
  });
  showResult('video-result',r.ok, r.ok?`视频已创建: ${r.id}`:r.error);
}

// ========== 推送 ==========
async function doPush(){
  $('push-result').className='result success';
  $('push-result').innerHTML='<pre>⏳ 正在推送，请稍候...</pre>';
  const r=await api('/api/push',{message:$('push-msg').value.trim()||'通过管理工具更新内容'});
  showResult('push-result',r.ok, r.ok?`推送成功!\n${r.log}`:r.error);
}

// ========== 管理博客 ==========
async function loadPostsList(){
  const el=$('posts-list');
  try{const posts=await api('/api/posts/list');
    if(posts.length===0){el.innerHTML='<p style="color:#666">暂无文章</p>';return;}
    el.innerHTML=`<table style="width:100%;border-collapse:collapse"><thead><tr style="color:#999;font-size:12px;text-align:left"><th>标题</th><th>分类</th><th>日期</th><th style="width:120px">操作</th></tr></thead><tbody>`+
      posts.map(p=>`<tr style="border-bottom:1px solid #2a2a4a"><td style="padding:8px 0">${esc(p.title)}</td><td style="padding:8px 0;color:#888">${esc(p.category)}</td><td style="padding:8px 0;color:#666;font-size:12px">${esc(p.published||'')}</td><td style="padding:8px 0"><button class="btn" style="background:#a78bfa;color:#fff;padding:4px 12px;font-size:12px;margin-right:4px" onclick="editPost('${esc(p.category)}','${esc(p.slug)}')">编辑</button><button class="btn btn-danger" onclick="deletePost('${esc(p.category)}','${esc(p.slug)}')">删除</button></td></tr>`).join('')+
      '</tbody></table>';
  }catch(e){el.innerHTML='<p style="color:#f87171">加载失败</p>';}}
async function editPost(cat,slug){
  const r=await api(`/api/posts/detail?category=${encodeURIComponent(cat)}&slug=${encodeURIComponent(slug)}`);
  $('edit-post-cat').value=cat;$('edit-post-slug').value=slug;
  $('edit-post-title').value=r.title||'';
  $('edit-post-desc').value=r.description||'';
  $('edit-post-tags').value=(r.tags||[]).join(', ');
  $('edit-post-content').value=r.content||'';
  $('posts-list').style.display='none';$('posts-editor').style.display='block';
}
function cancelPostEdit(){$('posts-list').style.display='block';$('posts-editor').style.display='none';}
async function savePostEdit(){
  const data={
    category:$('edit-post-cat').value,slug:$('edit-post-slug').value,
    title:$('edit-post-title').value,description:$('edit-post-desc').value,
    tags:$('edit-post-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    content:$('edit-post-content').value
  };
  const r=await api('/api/posts/update',data);
  showResult('edit-post-result',r.ok,r.ok?'已保存':r.error);
  if(r.ok){cancelPostEdit();loadPostsList();}
}
async function deletePost(cat,slug){
  if(!confirm(`确认删除文章 "${slug}" 吗？此操作不可撤销！`)) return;
  const r=await api(`/api/posts/delete?category=${encodeURIComponent(cat)}&slug=${encodeURIComponent(slug)}`,null,'DELETE');
  if(r.ok) loadPostsList(); else alert('删除失败: '+r.error);
}

// ========== 管理作品 ==========
async function loadProjectsList(){
  const el=$('projects-admin-list');
  try{const projs=await api('/api/projects/list');
    if(projs.length===0){el.innerHTML='<p style="color:#666">暂无作品</p>';return;}
    el.innerHTML=`<table style="width:100%;border-collapse:collapse"><thead><tr style="color:#999;font-size:12px;text-align:left"><th>名称</th><th>类型</th><th>状态</th><th style="width:120px">操作</th></tr></thead><tbody>`+
      projs.map(p=>`<tr style="border-bottom:1px solid #2a2a4a"><td style="padding:8px 0">${esc(p.title)}</td><td style="padding:8px 0;color:#888">${p.type==='game'?'🎮 游戏':'💻 软件'}</td><td style="padding:8px 0;color:#666;font-size:12px">${esc(p.status||'')}</td><td style="padding:8px 0"><button class="btn" style="background:#a78bfa;color:#fff;padding:4px 12px;font-size:12px;margin-right:4px" onclick="editProject('${esc(p.id)}')">编辑</button><button class="btn btn-danger" onclick="deleteProject('${esc(p.id)}')">删除</button></td></tr>`).join('')+
      '</tbody></table>';
  }catch(e){el.innerHTML='<p style="color:#f87171">加载失败</p>';}}
async function editProject(id){
  const projs=await api('/api/projects/list');
  const p=projs.find(x=>x.id===id);
  if(!p) return alert('找不到项目');
  $('admin-proj-id').value=p.id;
  $('admin-proj-title').value=p.title||'';
  $('admin-proj-type').value=p.type||'software';
  $('admin-proj-desc').value=p.description||'';
  $('admin-proj-long').value=(p.longDescription||'').replace(/\\n/g,'\n');
  $('admin-proj-platform').value=p.platform||'';
  $('admin-proj-status').value=p.status||'开发中';
  $('admin-proj-tags').value=(p.tags||[]).join(', ');
  $('admin-proj-dl').value=(p.downloadLinks||[]).map(d=>`${d.label}|${d.url}|${d.icon||''}`).join('\n');
  $('admin-proj-featured').checked=p.featured===true;
  $('admin-proj-cover').value='';
  $('projects-admin-list').style.display='none';$('projects-admin-editor').style.display='block';
}
function cancelProjectEdit(){$('projects-admin-list').style.display='block';$('projects-admin-editor').style.display='none';}
async function saveProjectEdit(){
  const dlRaw=$('admin-proj-dl').value.trim();
  const downloadLinks=dlRaw?dlRaw.split('\n').map(line=>{const parts=line.split('|');return{label:parts[0]?.trim(),url:parts[1]?.trim(),icon:parts[2]?.trim()||undefined};}).filter(l=>l.label&&l.url):[];
  let coverBase64='';const f=$('admin-proj-cover').files[0];if(f) coverBase64=await fileToBase64(f);
  const data={
    id:$('admin-proj-id').value,title:$('admin-proj-title').value,
    type:$('admin-proj-type').value,description:$('admin-proj-desc').value,
    longDescription:$('admin-proj-long').value.replace(/\n/g,'\\n'),
    platform:$('admin-proj-platform').value,status:$('admin-proj-status').value,
    tags:$('admin-proj-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    downloadLinks,featured:$('admin-proj-featured').checked,coverBase64
  };
  const r=await api('/api/projects/update',data);
  showResult('edit-project-result',r.ok,r.ok?'已保存':r.error);
  if(r.ok){cancelProjectEdit();loadProjectsList();}
}
async function deleteProject(id){
  if(!confirm(`确认删除作品 "${id}" 吗？此操作不可撤销！`)) return;
  const r=await api(`/api/projects/delete?id=${encodeURIComponent(id)}`,null,'DELETE');
  if(r.ok) loadProjectsList(); else alert('删除失败: '+r.error);
}

// ========== 管理视频 ==========
async function loadVideosList(){
  const el=$('videos-admin-list');
  try{const vids=await api('/api/videos/list');
    if(vids.length===0){el.innerHTML='<p style="color:#666">暂无视频</p>';return;}
    el.innerHTML=`<table style="width:100%;border-collapse:collapse"><thead><tr style="color:#999;font-size:12px;text-align:left"><th>标题</th><th>BV号</th><th style="width:120px">操作</th></tr></thead><tbody>`+
      vids.map(v=>`<tr style="border-bottom:1px solid #2a2a4a"><td style="padding:8px 0">${esc(v.title)}</td><td style="padding:8px 0;color:#888;font-size:12px">${esc(v.bvid)}</td><td style="padding:8px 0"><button class="btn" style="background:#a78bfa;color:#fff;padding:4px 12px;font-size:12px;margin-right:4px" onclick="editVideo('${esc(v.id)}')">编辑</button><button class="btn btn-danger" onclick="deleteVideo('${esc(v.id)}')">删除</button></td></tr>`).join('')+
      '</tbody></table>';
  }catch(e){el.innerHTML='<p style="color:#f87171">加载失败</p>';}}
async function editVideo(id){
  const vids=await api('/api/videos/list');
  const v=vids.find(x=>x.id===id);
  if(!v) return alert('找不到视频');
  $('admin-vid-id').value=v.id;
  $('admin-vid-title').value=v.title||'';
  $('admin-vid-bvid').value=v.bvid||'';
  $('admin-vid-desc').value=v.description||'';
  $('admin-vid-featured').checked=v.featured===true;
  $('admin-vid-cover').value='';
  $('videos-admin-list').style.display='none';$('videos-admin-editor').style.display='block';
}
function cancelVideoEdit(){$('videos-admin-list').style.display='block';$('videos-admin-editor').style.display='none';}
async function saveVideoEdit(){
  let coverBase64='';const f=$('admin-vid-cover').files[0];if(f) coverBase64=await fileToBase64(f);
  const data={
    id:$('admin-vid-id').value,title:$('admin-vid-title').value,
    bvid:$('admin-vid-bvid').value,description:$('admin-vid-desc').value,
    featured:$('admin-vid-featured').checked,coverBase64
  };
  const r=await api('/api/videos/update',data);
  showResult('edit-video-result',r.ok,r.ok?'已保存':r.error);
  if(r.ok){cancelVideoEdit();loadVideosList();}
}
async function deleteVideo(id){
  if(!confirm(`确认删除视频 "${id}" 吗？此操作不可撤销！`)) return;
  const r=await api(`/api/videos/delete?id=${encodeURIComponent(id)}`,null,'DELETE');
  if(r.ok) loadVideosList(); else alert('删除失败: '+r.error);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}


// ========== 辅助 ==========
function fileToBase64(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
</script>
