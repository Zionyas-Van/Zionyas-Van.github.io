<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容管理 · ZionyasVan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛠</text></svg>">
<script src="/manage-icons.js"></script>
<style>
/* ============================================================
   设计令牌（Material 3 风格，紫色取自网站主题色）
   ============================================================ */
:root{
  --pri:#7c3aed; --pri-dark:#6d28d9; --pri-c:#ede9fe; --on-pri-c:#4c1d95;
  --bg:#f5f4fa; --surf:#ffffff; --surf-2:#f3f2f9; --surf-3:#eceaf4;
  --out:#e4e2ee; --out-2:#c9c6d8;
  --txt:#1b1a20; --txt-2:#55525f; --txt-3:#8a8797;
  --ok:#146c43; --ok-c:#dff3e8; --warn:#8a5300; --warn-c:#fdf0d9;
  --err:#b3261e; --err-c:#fce9e7;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:8px;
  --sh-1:0 1px 2px rgba(18,16,32,.06), 0 1px 3px rgba(18,16,32,.05);
  --sh-2:0 4px 14px rgba(18,16,32,.09);
  --rail:240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--pri); text-decoration:none}
a:hover{text-decoration:underline}
.ic{width:20px;height:20px;fill:currentColor;flex:none;display:block}

/* ============================ 左侧导航栏 ============================ */
.rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail); background:var(--surf);
  border-right:1px solid var(--out); padding:18px 12px; overflow-y:auto; z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:650;font-size:16px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pri),#a855f7);color:#fff;display:flex;align-items:center;justify-content:center}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--txt-3)}
.nav-group{margin-bottom:14px}
.nav-group>div{font-size:11px;letter-spacing:.1em;color:var(--txt-3);padding:6px 12px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:999px;cursor:pointer;
  color:var(--txt-2);font-size:14px;border:none;background:none;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surf-2);color:var(--txt)}
.nav-item[data-on="1"]{background:var(--pri-c);color:var(--on-pri-c);font-weight:600}
.nav-item .ic{width:19px;height:19px}

/* ============================ 主区 ============================ */
.main{margin-left:var(--rail); min-height:100vh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(245,244,250,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--out); padding:14px 28px; display:flex; align-items:center; gap:16px;
}
.topbar h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;font-size:12.5px;color:var(--txt-3)}
.topbar .grow{flex:1;min-width:0}
.viewport{padding:24px 28px 80px; max-width:920px; width:100%}

/* ============================ 卡片 / 通用 ============================ */
.card{background:var(--surf);border:1px solid var(--out);border-radius:var(--r-xl);padding:22px;box-shadow:var(--sh-1);margin-bottom:18px}
.card>h2{margin:0 0 4px;font-size:17px;font-weight:650;display:flex;align-items:center;gap:9px}
.card>h2 .ic{color:var(--pri)}
.card>.sub{margin:0 0 18px;font-size:13px;color:var(--txt-3)}
.card.flush{padding:0;overflow:hidden}
.muted{color:var(--txt-3);font-size:13px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
.sec-title{font-size:12px;font-weight:650;color:var(--txt-3);letter-spacing:.08em;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--txt-3);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.hint .ic{width:15px;height:15px;margin-top:2px;color:var(--txt-3)}

/* ============================ 表单 ============================ */
.f{margin-bottom:16px}
.f>label{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2);margin-bottom:6px}
.f>label .req{color:var(--err)}
input[type=text],input[type=url],input[type=date],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--out-2);border-radius:var(--r-md);
  background:var(--surf);color:var(--txt);font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
input::placeholder,textarea::placeholder{color:#b3b0be}
textarea{resize:vertical;line-height:1.7}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238a8797'><path d='M12 15.4 6.6 10h10.8z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:18px;padding-right:34px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px;color:var(--txt-2)}
.switch input{display:none}
.switch .track{width:44px;height:26px;border-radius:999px;background:var(--out-2);position:relative;transition:background .18s;flex:none}
.switch .track:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .18s}
.switch input:checked+.track{background:var(--pri)}
.switch input:checked+.track:after{transform:translateX(18px)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;
  border:1px solid transparent;background:var(--pri);color:#fff;font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:filter .15s,background .15s,box-shadow .15s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.tonal{background:var(--pri-c);color:var(--on-pri-c)}
.btn.outline{background:transparent;border-color:var(--out-2);color:var(--txt-2)}
.btn.outline:hover{background:var(--surf-2);filter:none}
.btn.danger{background:var(--err-c);color:var(--err)}
.btn.danger:hover{background:#f8d7d4}
.btn.icon{padding:9px;border-radius:12px;background:transparent;color:var(--txt-2)}
.btn.icon:hover{background:var(--surf-2);filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* 标签 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--out-2);border-radius:var(--r-md);padding:8px 10px;background:var(--surf);min-height:46px}
.chips:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
.chips input{border:none!important;padding:4px 2px!important;flex:1 1 120px;min-width:90px;box-shadow:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pri-c);color:var(--on-pri-c);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;font-weight:600}
.chip button{border:none;background:none;cursor:pointer;color:inherit;opacity:.65;padding:0;display:flex}
.chip button:hover{opacity:1}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1px dashed var(--out-2);background:transparent;color:var(--txt-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.sugg button:hover{border-color:var(--pri);color:var(--pri)}

/* 图片 / 列表行 */
.imgrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.imgrow input{flex:1 1 auto;min-width:0}
.imgrow .thumb{width:52px;height:52px;border-radius:var(--r-sm);border:1px solid var(--out);background:var(--surf-2);object-fit:cover;flex:none}
.coverbox{display:flex;gap:14px;align-items:flex-start}
.coverbox .preview{width:104px;height:104px;border-radius:var(--r-md);border:1px solid var(--out);background:var(--surf-2) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--txt-3);font-size:11px}
.coverbox .grow{flex:1;min-width:0}

/* 列表 */
.searchbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.searchbar .box{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--out-2);border-radius:999px;padding:8px 14px}
.searchbar .box input{border:none;padding:0;box-shadow:none!important;background:none}
.searchbar .box .ic{color:var(--txt-3);width:18px;height:18px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-lg);transition:background .12s}
.item:hover{background:var(--surf-2)}
.item+.item{border-top:1px solid var(--out)}
.item .thumb{width:46px;height:46px;border-radius:var(--r-sm);object-fit:cover;background:var(--surf-3);flex:none;display:flex;align-items:center;justify-content:center;color:var(--txt-3);overflow:hidden}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--txt-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .acts{display:flex;gap:4px;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--surf-3);color:var(--txt-2);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.badge.pri{background:var(--pri-c);color:var(--on-pri-c)}
.badge.ok{background:var(--ok-c);color:var(--ok)}
.badge.warn{background:var(--warn-c);color:var(--warn)}
.badge.err{background:var(--err-c);color:var(--err)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{background:var(--surf-2);color:var(--txt-2);border:1px solid var(--out);border-radius:999px;padding:1px 9px;font-size:11.5px;cursor:pointer}
.tag:hover{border-color:var(--pri);color:var(--pri)}
.empty{padding:36px;text-align:center;color:var(--txt-3);font-size:13.5px}
.empty .ic{width:36px;height:36px;margin:0 auto 10px;opacity:.5}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.stat{background:var(--surf);border:1px solid var(--out);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:box-shadow .15s,transform .15s;box-shadow:var(--sh-1)}
.stat:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--txt-3);margin-top:4px;display:flex;align-items:center;gap:6px}
.stat .l .ic{width:15px;height:15px}

/* 编辑器 */
.editor{margin-top:4px}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px;background:var(--surf-2);border:1px solid var(--out);border-bottom:none;border-radius:var(--r-md) var(--r-md) 0 0}
.toolbar button{border:none;background:transparent;color:var(--txt-2);border-radius:8px;padding:6px 8px;cursor:pointer;font:inherit;font-size:12.5px;display:flex;align-items:center;gap:5px}
.toolbar button:hover{background:var(--surf-3);color:var(--pri)}
.editor textarea{border-radius:0 0 var(--r-md) var(--r-md);min-height:320px;font-family:"JetBrains Mono Variable",ui-monospace,Consolas,monospace;font-size:13.5px}
.editor.preview textarea{display:none}
.previewbox{display:none;border:1px solid var(--out);border-radius:0 0 var(--r-md) var(--r-md);padding:18px 20px;background:var(--surf);min-height:320px;max-height:640px;overflow:auto}
.editor.preview .previewbox{display:block}
.previewbox h1,.previewbox h2,.previewbox h3{margin:18px 0 8px;line-height:1.35}
.previewbox p{margin:10px 0}
.previewbox img{max-width:100%;border-radius:var(--r-md)}
.previewbox code{background:var(--surf-2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.previewbox pre{background:var(--surf-2);padding:12px;border-radius:var(--r-md);overflow:auto}
.previewbox blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--pri);background:var(--surf-2);color:var(--txt-2)}
.editor-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-3);margin-top:6px}

/* 提示条 / 结果 */
.note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:14px}
.note .ic{width:18px;height:18px;margin-top:1px}
.note.info{background:var(--pri-c);color:var(--on-pri-c)}
.note.ok{background:var(--ok-c);color:var(--ok)}
.note.warn{background:var(--warn-c);color:var(--warn)}
.note.err{background:var(--err-c);color:var(--err)}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.step{display:flex;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.step .ic{width:17px;height:17px;color:var(--txt-3)}
.step[data-s=in_progress] .ic{color:var(--pri)}
.step[data-s=success] .ic{color:var(--ok)}
.step[data-s=failure] .ic{color:var(--err)}
.progress{height:6px;border-radius:999px;background:var(--surf-3);overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--pri);transition:width .4s}
.log{background:#1b1a20;color:#d7d5e0;border-radius:var(--r-md);padding:14px;font:12.5px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:280px;overflow:auto;margin-top:12px}

/* Toast */
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:#26242e;color:#fff;border-radius:var(--r-md);padding:12px 16px;font-size:13.5px;box-shadow:var(--sh-2);display:flex;gap:9px;align-items:center;max-width:380px;animation:pop .18s ease-out}
.toast.ok .ic{color:#6ee7a8}
.toast.err .ic{color:#ffb4ab}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 弹窗 */
#modal-root{position:fixed;inset:0;z-index:70;display:none}
#modal-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,18,28,.42)}
.dialog{position:relative;margin:5vh auto;max-width:760px;width:calc(100% - 32px);background:var(--surf);border-radius:var(--r-xl);box-shadow:var(--sh-2);max-height:90vh;display:flex;flex-direction:column}
.dialog header{padding:18px 22px;border-bottom:1px solid var(--out);display:flex;align-items:center;gap:10px}
.dialog header h3{margin:0;font-size:16.5px;font-weight:650;flex:1}
.dialog .body{padding:20px 22px;overflow:auto}
.dialog footer{padding:14px 22px;border-top:1px solid var(--out);display:flex;gap:10px;justify-content:flex-end}

/* 小屏：导航栏变成顶部横滚 */
@media (max-width:900px){
  .rail{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--out);padding:12px}
  .brand{padding:4px 6px 12px}
  .nav-group{margin-bottom:8px}
  .nav-group>div{padding:4px 6px}
  .nav-group .items{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav-item{width:auto;white-space:nowrap;border-radius:999px;background:var(--surf-2)}
  .main{margin-left:0}
  .topbar{padding:12px 16px}
  .viewport{padding:16px 16px 70px}
  .card{padding:18px;border-radius:var(--r-lg)}
  .row>*{flex:1 1 100%}
}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 7v10l8 5 8-5V7zm0 2.3 5.5 3.4L12 11.1 6.5 7.7zM6 9.4l5 3.1v6.9l-5-3.1zm7 10V12.5l5-3.1v6.9z"/></svg></div>
    <div>内容管理<small>ZionyasVan</small></div>
  </div>
  <nav id="nav"></nav>
</aside>

<div class="main">
  <header class="topbar">
    <div class="grow">
      <h1 id="p-title">仪表盘</h1>
      <p id="p-sub">站点内容一览</p>
    </div>
    <button class="btn outline sm" data-act="reload"><span class="ic" data-ic="refresh"></span>刷新数据</button>
  </header>
  <div class="viewport" id="view"></div>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   基础工具
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ICONS = window.MS_ICONS || {};
const ic = (name, cls = "") =>
  `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
const esc = (s) =>
  String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const nl2br = (s) => esc(s).replace(/\\n/g, "<br>");

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { error: text.slice(0, 300) || "返回内容无法解析" }; }
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}
const post = (p, body) => api(p, { method: "POST", body: JSON.stringify(body) });
const put  = (p, body) => api(p, { method: "PUT",  body: JSON.stringify(body) });
const del  = (p)       => api(p, { method: "DELETE" });

function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `${ic(kind === "err" ? "error" : "check-circle")}<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 6000 : 3200);
}
function showError(e) { toast(e && e.message ? e.message : String(e), "err"); }

/* 弹窗 */
function openDialog({ title, body, footer }) {
  const root = $("#modal-root");
  root.innerHTML = `
    <div class="scrim" data-act="close-modal"></div>
    <div class="dialog" role="dialog" aria-modal="true">
      <header>${ic("edit")}<h3>${esc(title)}</h3>
        <button class="btn icon" data-act="close-modal" title="关闭">${ic("close")}</button>
      </header>
      <div class="body">${body}</div>
      ${footer ? `<footer>${footer}</footer>` : ""}
    </div>`;
  root.classList.add("on");
  return root;
}
function closeDialog() { const r = $("#modal-root"); r.classList.remove("on"); r.innerHTML = ""; }

/* ============================================================
   字段系统：所有表单都由字段描述生成，避免"某个字段忘了做"
   ============================================================ */
const FIELD = {
  text: (f, v) => `<input type="text" data-k="${f.k}" placeholder="${esc(f.ph || "")}" value="${esc(v ?? f.def ?? "")}">`,
  url:  (f, v) => `<input type="url" data-k="${f.k}" placeholder="${esc(f.ph || "https://…")}" value="${esc(v ?? f.def ?? "")}">`,
  area: (f, v) => `<textarea data-k="${f.k}" rows="${f.rows || 3}" placeholder="${esc(f.ph || "")}">${esc(v ?? f.def ?? "")}</textarea>`,
  select: (f, v) => `<select data-k="${f.k}">${(f.options || [])
      .map(([val, label]) => `<option value="${esc(val)}"${String(v ?? f.def) === String(val) ? " selected" : ""}>${esc(label)}</option>`)
      .join("")}</select>`,
  switch: (f, v) => `<label class="switch"><input type="checkbox" data-k="${f.k}"${v === true || v === "true" ? " checked" : ""}><span class="track"></span><span>${esc(f.text || f.label)}</span></label>`,
  chips: (f, v) => {
    const list = Array.isArray(v) ? v : [];
    return `<div class="chips" data-chips="${f.k}">
      ${list.map((t) => chipHtml(t)).join("")}
      <input type="text" data-chip-input="${f.k}" placeholder="${esc(f.ph || "输入后按回车添加")}">
    </div>
    <div class="sugg" data-sugg="${f.k}"></div>`;
  },
  image: (f, v) => `<div class="coverbox">
      <div class="preview" data-preview="${f.k}" style="${v ? `background-image:url('${esc(v)}')` : ""}">${v ? "" : "无图"}</div>
      <div class="grow">
        <input type="url" data-k="${f.k}" placeholder="${esc(f.ph || "贴入图片链接")}" value="${esc(v ?? "")}">
        <div class="actions" style="margin-top:10px">

const linkRowHtml = (l = {}, i) => `<div class="imgrow" data-i="${i}">
  <input type="text" class="lk-label" placeholder="按钮文字" value="${esc(l.label || "")}" style="flex:0 1 130px">

function fieldHtml(f, v) {
  const need = f.required ? ' <span class="req">*</span>' : "";
  const wide = ["markdown", "imagelist", "links", "chips"].includes(f.type);
  return `<div class="f" data-f="${f.k}"${wide ? ' style="flex:1 1 100%"' : ""}>
    ${f.type === "switch" ? FIELD.switch(f, v) : `<label>${esc(f.label)}${need}</label>${FIELD[f.type](f, v)}`}
  </div>`;
}
function formHtml(fields, values = {}) {
  let out = "", i = 0;
  while (i < fields.length) {
    const f = fields[i];
    const wide = ["markdown", "imagelist", "links", "chips"].includes(f.type);
    if (!wide && fields[i + 1] && !["markdown", "imagelist", "links", "chips", "switch"].includes(fields[i + 1].type)) {
      out += `<div class="row">${fieldHtml(f, values[f.k])}${fieldHtml(fields[i + 1], values[fields[i + 1].k])}</div>`;
      i += 2;
    } else {
      out += fieldHtml(f, values[f.k]);
      i += 1;
    }
  }
  return out;
}
function readForm(root) {
  const out = {};
  $$("[data-k]", root).forEach((el) => {
    const k = el.dataset.k;
    if (el.type === "checkbox") out[k] = el.checked;
    else if (el.dataset.k && el.tagName === "SELECT") out[k] = el.value;
    else out[k] = el.value;
  });
  $$("[data-chips]", root).forEach((box) => {
    out[box.dataset.chips] = $$(".chip", box).map((c) => c.dataset.val);
  });
  $$("[data-imglist]", root).forEach((box) => {
    out[box.dataset.imglist] = $$(".img-url", box).map((i) => i.value.trim()).filter(Boolean);
  });
  $$("[data-links]", root).forEach((box) => {
    out[box.dataset.links] = $$(".imgrow", box)
      .map((r) => ({ label: $(".lk-label", r).value.trim(), url: $(".lk-url", r).value.trim(), icon: $(".lk-icon", r).value.trim() }))
      .filter((l) => l.label && l.url);
  });
  return out;
}
/* slug 预览（与服务器同规则，仅用于显示） */
function slugPreview(title) {
  let base = String(title || "").toLowerCase().replace(/['"’”]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if (base.length < 3) {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    base = `post-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-随机4位`;
  }
  return base.slice(0, 60);
}

/* 渲染令牌：切页时丢弃"迟到的旧渲染"，否则旧结果会把新页面覆盖掉 */
let renderToken = 0;

async function go(panel) {
  STATE.panel = panel;
  renderNav();
  const [t, s] = PANEL_META[panel] || ["", ""];
  $("#p-title").textContent = t;
  $("#p-sub").textContent = s;
  const token = ++renderToken;
  const view = $("#view");
  view.innerHTML = `<div class="card"><p class="muted">加载中…</p></div>`;
  try {
    const html = await buildPanel(panel);
    if (token !== renderToken) return;
    view.innerHTML = html;
    await afterRender(panel);
  } catch (e) {
    if (token !== renderToken) return;
    view.innerHTML = `<div class="card"><div class="note err">${ic("error")}<span>${esc(e.message)}</span></div>
      <div class="actions"><button class="btn outline" data-act="reload">${ic("refresh")}重试</button></div></div>`;
  }
}
async function buildPanel(panel) {
  if (panel === "dash") return buildDash();
  if (panel === "deploy") return buildDeploy();
  if (panel.startsWith("pub-")) return buildPublish(panel.slice(4));
  if (panel.startsWith("adm-")) return buildManage(panel.slice(4));
  return `<div class="card">未知页面</div>`;
}
async function afterRender(panel) {
  await loadRefs();
  wireDynamic($("#view"));
  updateCounts($("#view"));
  if (panel.startsWith("adm-")) {
    const q = $("#q");
    if (q) {
      q.addEventListener("input", () => renderList(panel.slice(4), q.value.trim()));
      renderList(panel.slice(4), "");
    }
  }
  if (panel === "dash") loadDeployInto("#dash-deploy");
  if (panel === "deploy") loadDeployInto("#deploy-box");
}
/* 部署状态异步填充：绝不阻塞页面渲染 */
async function loadDeployInto(sel) {
  if (!$(sel)) return;
  $(sel).innerHTML = `<div class="note info">${ic("progress-activity")}<span>正在查询部署状态…</span></div>`;
  let d = null;
  try { d = await api("/api/deploy-status"); } catch { d = null; }
  const el = $(sel);
  if (el) el.innerHTML = deployHtml(d);
  if (d && d.run && (d.run.status === "in_progress" || d.run.status === "queued")) startDeployPoll();
}

/* 通用：给动态小组件挂事件（在容器上做事件委托，只挂一次） */
function wireDynamic(root) {
  root.querySelectorAll("[data-editor]").forEach((ed) => {
    if (ed.dataset.wired === "1") return;
    ed.dataset.wired = "1";
    const ta = $("textarea", ed);
    const cnt = $("[data-count]", ed) || $(`[data-count="${ta.dataset.k}"]`, root);
    const upd = () => { if (cnt) cnt.textContent = `${ta.value.length} 字`; };
    ta.addEventListener("input", upd);
    upd();
  });
}
function updateCounts(root) {
  root.querySelectorAll("[data-editor]").forEach((ed) => {
    const ta = $("textarea", ed);
    const cnt = $("[data-count]", ed);
    if (cnt && ta) cnt.textContent = `${ta.value.length} 字`;
  });
}

async function buildManage(key) {

  return `
    <div class="card">
      <h2>${ic(ent.icon)}${ent.name}列表</h2>
      <p class="sub">共 <span id="cnt-all">${items.length}</span> 条，支持按标题/标签/分类搜索</p>
      <div class="searchbar">
        <label class="box">${ic("search")}<input type="text" id="q" placeholder="搜索${ent.name}…"></label>

      </div>
      <div id="list" class="list"><div class="empty">加载中…</div></div>
    </div>`;

function matchItem(ent, it, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  return (ent.searchKeys || []).some((k) => String(it[k] ?? "").toLowerCase().includes(s))
    || (it.tags || []).some((t) => String(t).toLowerCase().includes(s));
}
function renderList(key, q) {
  const ent = ENTITIES[key];
  const all = STATE.caches[key] || [];
  const items = all.filter((it) => matchItem(ent, it, q));
  const box = $("#list");
  if (!items.length) {
    box.innerHTML = `<div class="empty">${ic("search")}<div>${q ? `没有匹配「${esc(q)}」的内容` : "还没有内容"}</div></div>`;
    return;
  }
  box.innerHTML = items.map((it, i) => {
    const thumb = ent.thumb(it);
    const isImg = thumb && /^(https?:|\/)/.test(thumb);
    return `<div class="item" data-idx="${all.indexOf(it)}">
      <div class="thumb">${isImg ? `<img src="${esc(thumb)}" alt="" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='${ic(ent.icon).replace(/'/g, "&#39;")}'">` : ic(ent.icon)}</div>
      <div class="body">
        <div class="t">${esc(ent.title(it) || "(无标题)")}</div>
        <div class="m"><span>${esc(ent.sub(it) || "")}</span></div>
        ${(it.tags || []).length ? `<div class="tags">${it.tags.map((t) => `<span class="tag" data-act="filter-tag" data-q="${esc(t)}">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>

        <button class="btn icon" data-act="edit" data-key="${key}" title="编辑">${ic("edit")}</button>
        <button class="btn icon" data-act="del" data-key="${key}" title="删除">${ic("delete")}</button>
      </div>
    </div>`;
  }).join("");
}

/* ============================================================
   推送与部署
   ============================================================ */
function deployHtml(d) {
  if (!d) return `<div class="note warn">${ic("warning")}<span>暂时拿不到部署状态（可能是网络问题，或仓库地址变了）</span></div>`;
  if (d.error) return `<div class="note err">${ic("error")}<span>${esc(d.error)}</span></div>`;
  const r = d.run || {};
  const map = { queued: ["排队中", "warn"], in_progress: ["构建中", "pri"], completed: [r.conclusion === "success" ? "部署成功" : "部署失败", r.conclusion === "success" ? "ok" : "err"] };
  const [label, cls] = map[r.status] || [r.status, ""];
  const steps = ((d.jobs || [])[0] || {}).steps || [];
  const done = steps.filter((s) => s.conclusion === "success").length;
  const pct = steps.length ? Math.round((done / steps.length) * 100) : 0;
  return `
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge ${cls}">${esc(label)}</span>
      <span class="muted">第 ${r.number} 次 · ${esc(r.sha || "")} · ${esc(r.title || "")}</span>
      ${r.url ? `<a class="muted" href="${esc(r.url)}" target="_blank">在 GitHub 查看</a>` : ""}
    </div>
    ${r.status === "in_progress" || r.status === "queued" ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ""}
    ${steps.length ? `<div class="steps">${steps.map((s) => `<div class="step" data-s="${s.conclusion || s.status}">
        ${ic(s.conclusion === "success" ? "check-circle" : s.status === "in_progress" ? "progress-activity" : s.conclusion === "failure" ? "error" : "schedule")}
        <span>${esc(s.name)}</span></div>`).join("")}</div>` : ""}
    <div class="muted" style="margin-top:10px">查询时间：${esc((d.fetchedAt || "").replace("T", " ").slice(0, 19))}</div>`;
}
let deployTimer = null;
function startDeployPoll() {
  if (deployTimer) return;
  deployTimer = setInterval(async () => {
    try {
      const d = await api("/api/deploy-status");
      const box = $("#dash-deploy") || $("#deploy-box");
      if (box) box.innerHTML = deployHtml(d);
      if (!d.run || d.run.status === "completed") stopDeployPoll();
    } catch {}
  }, 5000);
}
function stopDeployPoll() { if (deployTimer) { clearInterval(deployTimer); deployTimer = null; } }

async function buildDeploy() {
  return `
    <div class="card">
      <h2>${ic("upload")}推送到线上</h2>
      <p class="sub">会把当前所有改动提交到 GitHub，然后自动触发构建发布</p>
      <div class="f"><label>提交说明</label>

        <button class="btn outline" data-act="refresh-deploy">${ic("refresh")}刷新部署状态</button>

    </div>
    <div class="card">

/* ============================================================
   事件委托
   ============================================================ */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act],[data-nav]");
  if (!t) return;
  if (t.dataset.nav) { stopDeployPoll(); return go(t.dataset.nav); }
  const act = t.dataset.act;
  const view = $("#view");
  const formRoot = t.closest("#edit-form") || t.closest("#pub-form") || $("#modal-root");

  try {
    if (act === "close-modal") return closeDialog();
    if (act === "reload") { toast("已刷新"); return go(STATE.panel); }

    /* ---- 发布：保存 / 重置 ---- */
    if (act === "pub-save") {
      const key = t.dataset.ent, ent = ENTITIES[key];
      const data = readForm($("#pub-form"));
      if (key === "resource") {
        const sel = $('[data-k="category"][data-res="1"]');
        const nw = $('[data-k="category"][data-res-new="1"]');
        data.category = sel && sel.value === "__new__" ? (nw ? nw.value.trim() : "") : (sel ? sel.value : "");
      }
      if (key === "video" && !String(data.id || "").trim()) data.id = String(data.bvid || "").trim();
      if (!data.slug) delete data.slug; // 交给服务器自动生成
      t.disabled = true;
      const r = await post(ent.create, data);
      t.disabled = false;
      toast(`已保存：${ent.name}`);
      $("#pub-result").innerHTML = `<div class="note ok">${ic("check-circle")}<span>保存成功${
        r.path ? `：src/content/posts/${esc(r.path)}` : r.id ? `，ID：${esc(r.id)}` : ""
      }${r.slug ? `（URL 标识：${esc(r.slug)}）` : ""}</span></div>`;
      if (key === "novel" && r.id) {
        const it = await api("/api/novels/list").then((l) => l.find((x) => x.id === r.id));
        if (it) return openEditor("novel", it);
      }
      if (key === "post") { $("#pub-form").reset(); await loadRefs(); }
      return;
    }
    if (act === "pub-reset") { return go(STATE.panel); }

    /* ---- 分类下拉选「新建」 ---- */
    if (t.tagName === "SELECT" && t.dataset.res === "1") {
      const nw = $('[data-k="category"][data-res-new="1"]');
      if (nw) nw.style.display = t.value === "__new__" ? "block" : "none";
    }

    /* ---- 动态字段：标签 / 图片列表 / 下载链接 ---- */
    if (act === "del-chip") { t.closest(".chip").remove(); return; }
    if (act === "add-img") {
      const box = $(`[data-imglist="${t.dataset.target}"]`);
      const idx = box.querySelectorAll(".imgrow").length;
      t.insertAdjacentHTML("beforebegin", imgRowHtml("", idx));
      return;
    }
    if (act === "del-img") { t.closest(".imgrow").remove(); return; }
    if (act === "up-img") {
      const row = t.closest(".imgrow"), prev = row.previousElementSibling;
      if (prev && prev.classList.contains("imgrow")) prev.before(row);
      return;
    }
    if (act === "add-link") {
      const box = $(`[data-links="${t.dataset.target}"]`);
      t.insertAdjacentHTML("beforebegin", linkRowHtml({}, box.querySelectorAll(".imgrow").length));
      return;
    }
    if (act === "del-link") { t.closest(".imgrow").remove(); return; }

    /* ---- 封面：上传 / 清除 ---- */
    if (act === "upload") { return pickImage((url) => setImageValue(t.dataset.target, url)); }
    if (act === "clear-img") return setImageValue(t.dataset.target, "");

    /* ---- Markdown 工具 ---- */
    if (act === "md") {
      const ed = t.closest("[data-editor]");
      return mdInsert($("textarea", ed), t.dataset.md);
    }
    if (act === "mdpreview") {
      const ed = t.closest("[data-editor]");
      ed.classList.toggle("preview");
      $(".previewbox", ed).innerHTML = mdToHtml($("textarea", ed).value);
      return;
    }
    if (act === "gen-slug") {
      const title = $('[data-k="title"]', formRoot).value;
      $('[data-k="slug"]', formRoot).value = slugPreview(title);
      return toast("已按标题生成 URL 标识");
    }

    /* ---- 列表 ---- */
    if (act === "clear-q") { const q = $("#q"); if (q) { q.value = ""; renderList(STATE.panel.slice(4), ""); } return; }
    if (act === "filter-tag" || act === "find-post") {
      const q = t.dataset.q;
      const target = act === "find-post" ? "adm-post" : STATE.panel;
      if (STATE.panel !== target) await go(target);
      const box = $("#q");
      if (box) { box.value = q; renderList(target.slice(4), q); }
      return;
    }
    if (act === "edit") {
      const key = t.dataset.key;
      const item = STATE.caches[key][Number(t.closest(".item").dataset.idx)];
      return openEditor(key, item);
    }
    if (act === "del") {
      const key = t.dataset.key, ent = ENTITIES[key];
      const item = STATE.caches[key][Number(t.closest(".item").dataset.idx)];
      if (!confirm(`确认删除「${ent.title(item)}」吗？此操作不可撤销。`)) return;
      await del(ent.remove(item));
      toast("已删除");
      return go(STATE.panel);
    }
    if (act === "save-edit") {
      const key = t.dataset.key, ent = ENTITIES[key];
      const ctx = JSON.parse($("#modal-root").dataset.editCtx || "{}");
      const data = { ...readForm($("#edit-form")) };
      if (key === "post") { data.category = ctx.category; data.slug = ctx.slug; }
      if (key === "novel") { data.id = ($("#edit-form [data-k=id]") || {}).value || $("#modal-root").dataset.novelId; }
      if (key === "novel") data.id = JSON.parse($("#chapter-mgr").dataset.item).id;
      if (!data.slug) delete data.slug;
      await put(ent.update, data);
      closeDialog();
      toast("已保存修改");
      return go(STATE.panel);
    }

    /* ---- 章节 ---- */
    if (act === "ch-add") return chapterDialog(-1);
    if (act === "ch-edit") return chapterDialog(Number(t.dataset.i));
    if (act === "ch-del") {
      const item = JSON.parse($("#chapter-mgr").dataset.item);
      if (!confirm("删除这一章？")) return;
      item.chapters.splice(Number(t.dataset.i), 1);
      renderChapterMgr(item);
      return;
    }
    if (act === "ch-save") {
      const item = JSON.parse($("#chapter-mgr").dataset.item);
      const d = readForm($("#ch-form"));
      if (!d.title) return toast("章节标题不能为空", "err");
      const idx = Number(t.dataset.i);
      const slug = d.slug || `chapter-${String((idx >= 0 ? idx : (item.chapters || []).length) + 1).padStart(2, "0")}`;
      const ch = { slug, title: d.title, date: d.date || "", content: d.content || "" };
      item.chapters = item.chapters || [];
      if (idx >= 0) item.chapters[idx] = ch; else item.chapters.push(ch);
      closeDialog();
      renderChapterMgr(item);
      return toast("章节已更新，别忘了点「保存修改」写回文件");
    }

    /* ---- 推送 / 部署 ---- */
    if (act === "push") {
      const msg = ($("#push-msg") || {}).value || "更新内容";
      t.disabled = true;
      $("#push-log").innerHTML = `<div class="note info">${ic("progress-activity")}<span>正在推送…</span></div>`;
      try {
        const r = await post("/api/push", { message: msg });
        $("#push-log").innerHTML = `<div class="note ok">${ic("check-circle")}<span>推送完成，正在等待构建</span></div><div class="log">${esc(r.log || "")}</div>`;
        toast("已推送，正在构建");
        const d = await api("/api/deploy-status").catch(() => null);
        const box = $("#deploy-box"); if (box) box.innerHTML = deployHtml(d);
        startDeployPoll();
      } catch (err) {
        $("#push-log").innerHTML = `<div class="note err">${ic("error")}<span>${esc(err.message)}</span></div>`;
      }
      t.disabled = false;
      return;
    }
    if (act === "refresh-deploy") {
      const d = await api("/api/deploy-status").catch(() => null);
      const box = $("#dash-deploy") || $("#deploy-box");
      if (box) box.innerHTML = deployHtml(d);
      if (d && d.run && (d.run.status === "in_progress" || d.run.status === "queued")) startDeployPoll();
      return toast("部署状态已刷新");
    }
  } catch (err) { showError(err); }
});

/* 标签输入：回车添加 */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modal-root").classList.contains("on")) return closeDialog();
  const inp = e.target.closest("[data-chip-input]");
  if (!inp) return;
  if (e.key === "Enter" || e.key === "," || e.key === "，" ) {
    e.preventDefault();
    const v = inp.value.trim().replace(/[,，]$/, "");
    if (!v) return;
    const box = inp.closest("[data-chips]");
    if ($$(".chip", box).some((c) => c.dataset.val === v)) { inp.value = ""; return; }
    inp.insertAdjacentHTML("beforebegin", chipHtml(v));
    inp.value = "";
  } else if (e.key === "Backspace" && !inp.value) {
    const chips = $$(".chip", inp.closest("[data-chips]"));
    if (chips.length) chips[chips.length - 1].remove();
  }
});
/* 标签候选渲染（输入框获得焦点时展示） */
document.addEventListener("focusin", (e) => {
  const inp = e.target.closest("[data-chip-input]");
  if (!inp) return;
  const key = inp.dataset.chipInput;
  const box = $(`[data-sugg="${key}"]`);
  if (!box) return;

  const list = STATE.refs.tags.filter((t) => !used.has(t)).slice(0, 18);
  box.innerHTML = list.length ? list.map((t) => `<button type="button" data-tagpick="${esc(t)}">${esc(t)}</button>`).join("") : "";
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tagpick]");
  if (!b) return;
  const box = b.closest(".sugg").previousElementSibling;
  const inp = $("[data-chip-input]", box);
  const v = b.dataset.tagpick;

  b.remove();
});
/* 封面链接变化时更新预览 */
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-k]");
  if (!el) return;
  const key = el.dataset.k;
  const pv = $(`[data-preview="${key}"]`);
  if (pv) pv.style.backgroundImage = el.value ? `url('${el.value}')` : "";
  const ed = el.closest("[data-editor]");
  if (ed && ed.classList.contains("preview")) $(".previewbox", ed).innerHTML = mdToHtml(el.value);
});

/* 图片选择（本地文件 → 上传 → 回填链接） */
function pickImage(cb) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    if (file.size > 6 * 1024 * 1024) return toast("图片太大（超过 6MB），建议先压缩或用图床", "err");
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        toast("正在上传…");
        const r = await post("/api/upload-image", { data: fr.result });
        cb(r.path);
        toast("已上传并填入链接");
      } catch (e) { showError(e); }
    };
    fr.readAsDataURL(file);
  };
  inp.click();
}
function setImageValue(key, url) {
  const inp = $(`[data-k="${key}"]`);
  if (inp) { inp.value = url; inp.dispatchEvent(new Event("input", { bubbles: true })); }
}

/* Markdown 工具 */
function mdInsert(ta, kind) {
  if (!ta) return;
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const sel = ta.value.slice(s, e2);
  const wrap = { bold: ["**", "**", "粗体"], italic: ["*", "*", "斜体"], code: ["```\n", "\n```", "代码"] };
  let out;
  if (kind === "image") { return pickImage((url) => { insert(`![图片](${url})`); toast("图片已插入"); }); }
  if (kind === "link") out = `[${sel || "链接文字"}](https://)`;
  else if (kind === "h2") out = `\n## ${sel || "小标题"}\n`;
  else if (kind === "quote") out = `\n> ${sel || "引用"}\n`;
  else if (kind === "ul") out = `\n- ${sel || "列表项"}\n- \n`;
  else if (kind === "hr") out = `\n---\n`;
  else { const w = wrap[kind] || ["", "", ""]; out = `${w[0]}${sel || w[2]}${w[1]}`; }
  insert(out);
  function insert(text) {
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e2);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = s + text.length;
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
}

/* 极简 Markdown 预览 */
function mdToHtml(src) {
  const escd = esc(src);
  const inline = (s) => s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  const lines = escd.split(/\r?\n/);
  const out = [];
  let inCode = false, inUl = false, inOl = false;
  for (const line of lines) {
    if (/^```/.test(line)) { out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue; }
    if (inCode) { out.push(line); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { if (inUl) { out.push("</ul>"); inUl = false; } if (inOl) { out.push("</ol>"); inOl = false; }
      out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*[-*]\s+/.test(line)) { if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(line.replace(/^\s*[-*]\s+/, ""))}</li>`); continue; }
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (/^\s*\d+\.\s+/.test(line)) { if (!inOl) { out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(line.replace(/^\s*\d+\.\s+/, ""))}</li>`); continue; }
    if (inOl) { out.push("</ol>"); inOl = false; }
    if (/^\s*>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/, ""))}</blockquote>`); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); continue; }
    if (!line.trim()) { out.push(""); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inUl) out.push("</ul>");
  if (inOl) out.push("</ol>");
  if (inCode) out.push("</code></pre>");
  return out.join("\n");
}
